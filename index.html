<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宝丰能源 × 内蒙古动力煤价格看板</title>
    <style>
      html, body { background: #020617; }
    </style>
    <script type="module" crossorigin src="./assets/index-yUjpW8U_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DKOxPpmM.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showErr(m) {
          var r = document.getElementById('root');
          if (!r) return;
          var p = document.createElement('pre');
          p.style.cssText = 'color:#f87171;padding:24px;white-space:pre-wrap;font-size:13px';
          p.textContent = m;
          r.appendChild(p);
        }
        window.addEventListener('error', function (e) {
          showErr('ERR: ' + e.message + '\n' + (e.error && e.error.stack ? e.error.stack.slice(0, 1500) : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          showErr('REJ: ' + String(e.reason && e.reason.stack ? e.reason.stack.slice(0, 1500) : e.reason));
        });
        var ce = console.error.bind(console);
        console.error = function () {
          try { showErr('CONSOLE: ' + Array.prototype.map.call(arguments, function (x) { return String(x && x.stack ? x.stack.slice(0, 1500) : x); }).join(' ').slice(0, 2000)); } catch (_) {}
          ce.apply(null, arguments);
        };
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.children.length) showErr('NO-RENDER: 5s 后 root 仍为空');
        }, 5000);
      })();
    </script>
  </body>
</html>
